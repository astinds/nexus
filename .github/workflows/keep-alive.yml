name: Keep Supabase Alive (optional)

# Pings a health endpoint on a schedule to prevent Supabase Free tier
# from pausing the project after 7 days of inactivity.
#
# Requires: Repository secret NEXUS_HEALTH_URL (e.g. https://your-app.onrender.com/api/v1/health)
# Skips cleanly (exit 0) if the secret is not set.

on:
  schedule:
    # Every 5 days at 03:00 UTC — well within the 7-day idle window
    - cron: "0 3 */5 * *"
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: read

jobs:
  keep-alive:
    name: Ping health endpoint
    runs-on: ubuntu-latest
    steps:
      - name: Check secret is configured
        id: check
        env:
          HEALTH_URL: ${{ secrets.NEXUS_HEALTH_URL }}
        run: |
          if [ -z "$HEALTH_URL" ]; then
            echo "NEXUS_HEALTH_URL is not set — skipping keep-alive."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Ping health
        if: steps.check.outputs.configured == 'true'
        env:
          HEALTH_URL: ${{ secrets.NEXUS_HEALTH_URL }}
          NEXUS_ACCESS_KEY: ${{ secrets.NEXUS_ACCESS_KEY }}
        run: |
          echo "Pinging ${HEALTH_URL}..."
          curl --fail --silent --show-error \
            --max-time 90 --retry 2 --retry-delay 10 \
            "${HEALTH_URL}" | jq .
